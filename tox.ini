[tox]
envlist =
    py{38,39,310,311,312,313,314,315}

[testenv]
extras =
    test
deps =
    coverage
    pytest
commands =
    coverage run --parallel-mode -m pytest --junitxml={toxinidir}/reports/pytest-{envname}.xml {posargs}
    coverage combine --append
    coverage report -m

[testenv:check-packaging]
skip_install = true
deps =
    build
    twine
commands =
    python -m build -o {envtmpdir}/dist
    twine check {envtmpdir}/dist/*

[gh-actions]
python =
  3.8: py38
  3.9: py39
  3.10: py310
  3.11: py311
  3.12: py312, check-packaging
  3.13: py313
  3.14: py314
  3.15: py315
