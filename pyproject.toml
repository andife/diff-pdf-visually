[project]
name = "diff-pdf-visually"
description = "Quickly check whether there is a visible difference between two PDFs, using ImageMagick and pdftocairo."
readme = "README.rst"
authors = [{name = "Bram Geron", email = "bram@bram.xyz"}]
maintainers = [{name = "Bram Geron", email = "bram@bram.xyz"}]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
keywords = ["pdf", "diff", "visual-comparison", "imagemagick", "poppler"]
classifiers = [
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
]
dependencies = []
requires-python = ">=3.8"
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/andife/diff-pdf-visually"
Source = "https://github.com/andife/diff-pdf-visually"
Issues = "https://github.com/andife/diff-pdf-visually/issues"
Upstream = "https://github.com/bgeron/diff-pdf-visually"

[project.scripts]
diff-pdf-visually = "diff_pdf_visually.__main__:main"

[build-system]
requires = ['hatchling>=1.27.0']
build-backend = "hatchling.build"

[tool.hatch.version]
path = 'diff_pdf_visually/__init__.py'
